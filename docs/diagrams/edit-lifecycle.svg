<?xml version="1.0" encoding="UTF-8"?>
<svg id="edit-lifecycle-root" viewBox="0 0 960 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="edit-lifecycle-title edit-lifecycle-desc">
        <title id="edit-lifecycle-title">What happens when an agent edits a token</title>
        <desc id="edit-lifecycle-desc">Sequence of an update_token call: the MCP server asks the store to save the token, the store writes the source JSON and re-runs resolution and contrast checks; if every pair passes it rebuilds outputs, logs the change with a diff and returns the updated token, otherwise it restores the file and returns the failing pairs as a tool error.</desc>
        <defs>
          <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
          #edit-lifecycle-root { color: #1c2028; font-family: 'Geist', system-ui, sans-serif; }</style>
          <marker id="edit-lifecycle-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4b5260"/></marker>
          <marker id="edit-lifecycle-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2563eb"/></marker>
          <marker id="edit-lifecycle-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6d28d9"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f4f5f7"/>

