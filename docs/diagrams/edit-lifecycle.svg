  <line x1="872" y1="80" x2="872" y2="600" stroke="rgb(28,32,40)" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.2"/>
  <!-- alt frame -->
  <rect x="72" y="264" width="832" height="312" rx="4" fill="rgb(28,32,40)" stroke="rgb(28,32,40)" stroke-width="1" fill-opacity="0.02" stroke-opacity="0.22"/>
  <rect x="72" y="264" width="40" height="16" rx="2" fill="#f4f5f7" stroke="rgb(28,32,40)" stroke-width="1" stroke-opacity="0.22"/>
  <text x="92" y="276" fill="#4b5260" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
  <text x="124" y="276" fill="#4b5260" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">[every contrast pair passes]</text>
