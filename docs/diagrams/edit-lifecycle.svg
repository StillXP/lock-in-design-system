  <rect x="360" y="500" width="64" height="12" rx="2" fill="#f4f5f7"/>
  <text x="392" y="509" fill="#656c7a" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">422 + PAIRS</text>
