<?xml version="1.0" encoding="UTF-8"?>
<svg id="package-map-root" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="package-map-title package-map-desc">
        <title id="package-map-title">How the packages fit together</title>
        <desc id="package-map-desc">Dependency graph of the Lock In monorepo: web and mobile apps consume the React and React Native packages, agents and people use the hub server, and everything converges on the tokens package (four dependents) and icons (three).</desc>
        <defs>
          <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
          #package-map-root { color: #1c2028; font-family: 'Geist', system-ui, sans-serif; }</style>
          <marker id="package-map-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4b5260"/></marker>
          <marker id="package-map-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2563eb"/></marker>
          <marker id="package-map-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6d28d9"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f4f5f7"/>

