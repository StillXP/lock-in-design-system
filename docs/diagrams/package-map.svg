  <rect x="488" y="122" width="84" height="12" rx="2" fill="#f4f5f7"/>
  <text x="530" y="131" fill="#6d28d9" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">MCP · REST · UI</text>
  <path d="M800,96 V160" fill="none" stroke="#6d28d9" stroke-width="1.2" marker-end="url(#package-map-arrow-link)"/>
  <!-- react → icons, react → tokens -->
  <path d="M184,216 V240 Q184,248 192,248 H272 Q280,248 280,256 V280" fill="none" stroke="#4b5260" stroke-width="1.2" marker-end="url(#package-map-arrow)"/>
  <path d="M136,216 V364 Q136,372 144,372 H424 Q432,372 432,380 V400" fill="none" stroke="#4b5260" stroke-width="1.2" marker-end="url(#package-map-arrow)"/>
  <!-- hub → icons, hub → specs, hub → tokens -->
  <path d="M440,216 V240 Q440,248 432,248 H328 Q320,248 320,256 V280" fill="none" stroke="#4b5260" stroke-width="1.2" marker-end="url(#package-map-arrow)"/>
  <path d="M520,216 V240 Q520,248 528,248 H592 Q600,248 600,256 V280" fill="none" stroke="#4b5260" stroke-width="1.2" marker-end="url(#package-map-arrow)"/>
  <path d="M480,216 V400" fill="none" stroke="#4b5260" stroke-width="1.2" marker-end="url(#package-map-arrow)"/>
  <!-- specs → tokens -->
  <path d="M600,336 V356 Q600,364 592,364 H520 Q512,364 512,372 V400" fill="none" stroke="#4b5260" stroke-width="1.2" marker-end="url(#package-map-arrow)"/>
  <!-- react-native → icons (hops over hub→tokens and hub→specs) -->
  <path d="M776,216 V252 Q776,260 768,260 H608 a 8,8 0 0,0 -16,0 H488 a 8,8 0 0,0 -16,0 H368 Q360,260 360,268 V280" fill="none" stroke="#4b5260" stroke-width="1.2" marker-end="url(#package-map-arrow)"/>
