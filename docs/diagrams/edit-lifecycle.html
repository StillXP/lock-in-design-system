    <p class="eyebrow">Sequence · Lock In Design System</p>
    <h1>What happens when an agent edits a token</h1>
    <p class="caption">Edits are optimistic but never unsafe: the file is written, checked, and either committed to the change log or rolled back with the exact pairs that failed.</p>

        <desc id="edit-lifecycle-desc">Sequence of an update_token call: the MCP server asks the store to save the token, the store writes the source JSON and re-runs resolution and contrast checks; if every pair passes it rebuilds outputs, logs the change with a diff and returns the updated token, otherwise it restores the file and returns the failing pairs as a tool error.</desc>
