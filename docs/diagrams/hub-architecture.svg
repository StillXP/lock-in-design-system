<?xml version="1.0" encoding="UTF-8"?>
<svg id="hub-architecture-root" viewBox="0 0 1280 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hub-architecture-title hub-architecture-desc">
        <title id="hub-architecture-title">Inside the hub server</title>
        <desc id="hub-architecture-desc">Hub server architecture: browsers, scripts and remote agents authenticate with a bearer API key that maps to a role, then reach the REST API or the MCP server; local agents connect to the MCP server over stdio. Both share one store that writes tokens, specs and docs to git-tracked files and records keys, changes and releases in SQLite.</desc>
