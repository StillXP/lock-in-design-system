name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-title:
    # PRs are squash-merged, so the PR title becomes the commit message on main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check Conventional Commits format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title must look like 'type(scope): summary', e.g. 'feat(react): add Badge'. Got: $TITLE"
            exit 1
          fi

  chromatic:
    # Visual regression. Needs the CHROMATIC_PROJECT_KEY secret; skipped on PRs from forks, which can't read it.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Chromatic needs history to find the baseline build

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Storybook resolves workspace packages from their built dist/, so build those first.
      - name: Build workspace packages
        run: npm run build -w @lockin/tokens -w @lockin/icons -w @lockin/specs -w @lockin/react

      - name: Build Storybook
        run: npm run build -w @lockin/storybook

      - name: Publish to Chromatic
        run: npm run chromatic -w @lockin/storybook
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_KEY }}

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browser (story tests)
        run: npx playwright install --with-deps chromium

      # Build first: the typechecks resolve workspace packages (e.g. @lockin/icons) from their built dist/.
      - name: Build (includes Storybook story and axe tests)
        run: npm run build

      - name: Checks (contrast, specs, specs vs code, typecheck)
        run: npm run check

      - name: Spec tests
        run: npm test -w @lockin/specs

      - name: Server tests
        run: npm test -w @lockin/server
